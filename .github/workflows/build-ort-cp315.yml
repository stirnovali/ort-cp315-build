name: Build ONNX Runtime Windows cp315 Wheel

on:
  workflow_dispatch:
    inputs:
      ort_tag:
        description: "ONNX Runtime git tag"
        required: true
        default: "v1.32.0"

permissions:
  contents: write

jobs:
  build-win-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Setup Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          architecture: "x64"

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging "numpy==2.5.4" cmake ninja

      - name: Clone ONNX Runtime
        shell: pwsh
        run: |
          git clone --branch "${{ inputs.ort_tag }}" --depth 1 https://github.com/microsoft/onnxruntime.git ort

      - name: Patch setup.py for Python 3.15 classifier
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("ort/setup.py")
          s = p.read_text(encoding="utf-8")
          target = '"Programming Language :: Python :: 3.14",'
          if "3.15" not in s and target in s:
              s = s.replace(target, target + '\n    "Programming Language :: Python :: 3.15",')
              p.write_text(s, encoding="utf-8")
          print("setup.py patched successfully")
          '@ | python -

      - name: Build ONNX Runtime CPU Wheel
        shell: pwsh
        run: |
          cd ort
          python tools\ci_build\build.py `
            --build_dir build\Windows `
            --config Release `
            --build_wheel `
            --skip_tests `
            --parallel `
            --compile_no_warning_as_error `
            --cmake_generator Ninja

      - name: Collect Wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_out | Out-Null
          Get-ChildItem -Path ort\build\Windows -Recurse -Filter "*.whl" | Copy-Item -Destination dist_out -Force
          Get-ChildItem dist_out

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-${{ inputs.ort_tag }}-cp315-win_amd64
          path: dist_out/*.whl
          retention-days: 90

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ inputs.ort_tag }}-cp315"
          $whl = (Get-ChildItem dist_out\*.whl | Select-Object -First 1).FullName
          gh release create $tag $whl --title "ONNX Runtime ${{ inputs.ort_tag }} (Python 3.15 Windows x64)" --notes "Unofficial CPU wheel built from microsoft/onnxruntime ${{ inputs.ort_tag }} for Python 3.15 (cp315-win_amd64)." || gh release upload $tag $whl --clobber
